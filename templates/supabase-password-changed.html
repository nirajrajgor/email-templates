<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-apple-disable-message-reformatting">
    <title>Supabase Password Changed Template</title>
    <meta name="description" content="Alert users after a password change with this free Supabase password changed template. Customize the design and download responsive HTML for Supabase Auth.">
    <style type="text/css">
      a[x-apple-data-detectors],
      #MessageViewBody a,
      a[href^="tel"],
      a[href^="sms"] {
        color: inherit !important;
        text-decoration: none !important;
        font-weight: inherit !important;
      }

      @media only screen and (max-width: 620px) {
        .email-shell {
          width: 100% !important;
        }

        .content-cell {
          padding-left: 24px !important;
          padding-right: 24px !important;
        }

        .reset-button {
          display: block !important;
        }
      }
    </style>
    <!--[if mso]>
      <style type="text/css">
        body,
        table,
        td,
        a {
          font-family: Arial, Helvetica, sans-serif !important;
        }
        table,
        td {
          mso-table-lspace: 0pt !important;
          mso-table-rspace: 0pt !important;
        }
      </style>
    <![endif]-->
  
    <meta name="robots" content="noindex, follow"></head>
  <body style="
      margin: 0;
      padding: 0;
      width: 100% !important;
      background-color: #f3f4f6;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    " bgcolor="#f3f4f6">
    <div style="
        display: none;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        visibility: hidden;
        mso-hide: all;
      ">
      The password for {{ .Email }} was just changed.
    </div>

    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" align="center" style="
        width: 100% !important;
        min-width: 100%;
        table-layout: fixed;
        margin: 0 auto;
        background-color: #f3f4f6;
      " bgcolor="#f3f4f6">
      <tbody><tr>
        <td width="100%" align="center" style="width: 100%; padding: 40px 16px">
          <!--[if mso]>
            <table role="presentation" width="520" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td>
          <![endif]-->
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" align="center" class="email-shell email-card" style="
              width: 100%;
              max-width: 520px;
              margin: 0 auto;
              background-color: #ffffff;
              border: 1px solid #e5e7eb;
              overflow: hidden;
            " bgcolor="#ffffff">
            <tbody><tr>
              <td class="content-cell" style="
                  padding: 20px 36px;
                  background-color: #111827;
                  border-bottom: 4px solid #4f46e5;
                " bgcolor="#111827">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width: 100%">
                  <tbody><tr>
                    <td width="38" height="38" align="center" valign="middle" style="
                        width: 38px;
                        height: 38px;
                        background-color: #4f46e5;
                        border-radius: 8px;
                      " bgcolor="#4f46e5">
                      <span style="
                          display: block;
                          width: 9px;
                          height: 9px;
                          margin: 0 auto;
                          background-color: #ffffff;
                          border-radius: 50%;
                          font-size: 0;
                          line-height: 0;
                        ">&nbsp;</span>
                      <span style="
                          display: block;
                          width: 3px;
                          height: 8px;
                          margin: -1px auto 0;
                          background-color: #ffffff;
                          font-size: 0;
                          line-height: 0;
                        ">&nbsp;</span>
                    </td>
                    <td valign="middle" style="padding-left: 13px">
                      <!-- Replace the company name before sending. -->
                      <p style="
                          margin: 0;
                          color: #ffffff;
                          font-family: Arial, Helvetica, sans-serif;
                          font-size: 15px;
                          font-weight: bold;
                          line-height: 1.35;
                        ">
                        Acme
                      </p>
                      <p style="
                          margin: 2px 0 0;
                          color: #c7d2fe;
                          font-family: Arial, Helvetica, sans-serif;
                          font-size: 12px;
                          line-height: 1.35;
                        ">
                        Account security
                      </p>
                    </td>
                  </tr>
                </tbody></table>
              </td>
            </tr>

            <tr>
              <td class="content-cell" style="padding: 32px 36px 0">
                <h1 style="
                    margin: 0;
                    color: #111827;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 30px;
                    font-weight: bold;
                    letter-spacing: -0.65px;
                    line-height: 1.2;
                    text-align: left;
                  ">
                  Your password was changed
                </h1>
                <p style="
                    margin: 16px 0 0;
                    color: #4b5563;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 16px;
                    line-height: 1.65;
                    text-align: left;
                  ">
                  The password for
                  <strong style="color: #1f2937">{{ .Email }}</strong> was just
                  changed.
                </p>
              </td>
            </tr>

            <tr>
              <td class="content-cell" style="padding: 28px 36px 32px">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" align="center" style="width: 100%; min-width: 100%; margin: 0 auto">
                  <tbody><tr>
                    <td width="100%" align="center" bgcolor="#4f46e5" style="
                        width: 100%;
                        background-color: #4f46e5;
                        border-radius: 8px;
                      ">
                      <!--[if mso]>
                        <v:roundrect
                          xmlns:v="urn:schemas-microsoft-com:vml"
                          xmlns:w="urn:schemas-microsoft-com:office:word"
                          href="{{ .SiteURL }}"
                          style="height: 50px; v-text-anchor: middle; width: 446px"
                          arcsize="16%"
                          strokecolor="#4f46e5"
                          fillcolor="#4f46e5"
                        >
                          <w:anchorlock />
                          <center style="color: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: bold">
                            Reset password
                          </center>
                        </v:roundrect>
                      <![endif]-->
                      <!--[if !mso]><!-->
                      <a href="{{ .SiteURL }}" class="reset-button" style="
                          display: block;
                          width: 100%;
                          min-width: 100%;
                          box-sizing: border-box;
                          padding: 16px 24px;
                          color: #ffffff;
                          font-family: Arial, Helvetica, sans-serif;
                          font-size: 15px;
                          font-weight: bold;
                          line-height: 18px;
                          text-align: center;
                          text-decoration: none;
                        ">Reset password</a>
                      <!--<![endif]-->
                    </td>
                  </tr>
                </tbody></table>
              </td>
            </tr>

            <tr>
              <td class="content-cell" style="
                  padding: 20px 36px 22px;
                  background-color: #f9fafb;
                  border-top: 1px solid #e5e7eb;
                " bgcolor="#f9fafb">
                <p style="
                    margin: 0;
                    color: #4b5563;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 13px;
                    line-height: 1.6;
                  ">
                  Made this change? You can ignore this email. Questions?
                  <a href="{{ .SiteURL }}" style="
                      color: #111827;
                      font-weight: bold;
                      text-decoration: underline;
                    ">Get help</a>
                </p>
                <p style="
                    margin: 14px 0 0;
                    color: #9ca3af;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 12px;
                    line-height: 1.55;
                  ">
                  © Acme Inc. · 123 Main St., Springfield, IL 62701
                </p>
              </td>
            </tr>
          </tbody></table>
          <!--[if mso]>
                </td>
              </tr>
            </table>
          <![endif]-->
        </td>
      </tr>
    </tbody></table>
  

</body></html>

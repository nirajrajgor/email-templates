<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>Supabase Reauthentication Email Template</title>
    <meta
      name="description"
      content="Customize this free Supabase reauthentication email template for one-time verification codes, then preview and download the responsive HTML."
    />
    <style type="text/css">
      a[x-apple-data-detectors],
      #MessageViewBody a,
      a[href^="tel"],
      a[href^="sms"] {
        color: inherit !important;
        text-decoration: none !important;
        font-weight: inherit !important;
      }

      @media only screen and (max-width: 620px) {
        .email-shell {
          width: 100% !important;
        }

        .content-cell {
          padding-left: 24px !important;
          padding-right: 24px !important;
        }

        .token-value {
          font-size: 28px !important;
          letter-spacing: 5px !important;
        }
      }
    </style>
    <!--[if mso]>
      <style type="text/css">
        body,
        table,
        td,
        a {
          font-family: Arial, Helvetica, sans-serif !important;
        }
        table,
        td {
          mso-table-lspace: 0pt !important;
          mso-table-rspace: 0pt !important;
        }
      </style>
    <![endif]-->
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      width: 100% !important;
      background-color: #f3f4f6;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    "
    bgcolor="#f3f4f6"
  >
    <div
      style="
        display: none;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        visibility: hidden;
        mso-hide: all;
      "
    >
      Use this verification code to confirm your identity.
    </div>

    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      width="100%"
      align="center"
      style="
        width: 100% !important;
        min-width: 100%;
        table-layout: fixed;
        margin: 0 auto;
        background-color: #f3f4f6;
      "
      bgcolor="#f3f4f6"
    >
      <tr>
        <td
          width="100%"
          align="center"
          style="width: 100%; padding: 40px 16px"
        >
          <!--[if mso]>
            <table role="presentation" width="520" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td>
          <![endif]-->
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            width="100%"
            align="center"
            class="email-shell email-card"
            style="
              width: 100%;
              max-width: 520px;
              margin: 0 auto;
              background-color: #ffffff;
              border: 1px solid #e5e7eb;
              overflow: hidden;
            "
            bgcolor="#ffffff"
          >
            <tr>
              <td
                class="content-cell"
                style="padding: 30px 40px 32px; background-color: #111827"
                bgcolor="#111827"
              >
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  width="100%"
                  style="width: 100%"
                >
                  <tr>
                    <td
                      width="38"
                      height="38"
                      align="center"
                      valign="middle"
                      style="
                        width: 38px;
                        height: 38px;
                        background-color: #4f46e5;
                        border-radius: 8px;
                        color: #ffffff;
                        font-family: Arial, Helvetica, sans-serif;
                        font-size: 18px;
                        font-weight: bold;
                        line-height: 38px;
                        text-align: center;
                      "
                      bgcolor="#4f46e5"
                    >
                      A
                    </td>
                    <td
                      valign="middle"
                      style="padding-left: 13px"
                    >
                      <!-- Replace the company initial and name before sending. -->
                      <p
                        style="
                          margin: 0;
                          color: #ffffff;
                          font-family: Arial, Helvetica, sans-serif;
                          font-size: 15px;
                          font-weight: bold;
                          line-height: 1.35;
                        "
                      >
                        ACME
                      </p>
                      <p
                        style="
                          margin: 2px 0 0;
                          color: #c7d2fe;
                          font-family: Arial, Helvetica, sans-serif;
                          font-size: 11px;
                          line-height: 1.35;
                        "
                      >
                        Identity check
                      </p>
                    </td>
                  </tr>
                </table>

                <h1
                  style="
                    margin: 24px 0 0;
                    color: #ffffff;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 30px;
                    font-weight: bold;
                    letter-spacing: -0.6px;
                    line-height: 1.2;
                    text-align: left;
                  "
                >
                  Your verification code
                </h1>
              </td>
            </tr>

            <tr>
              <td class="content-cell" style="padding: 30px 40px 0">
                <p
                  style="
                    margin: 0;
                    color: #4b5563;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 16px;
                    line-height: 1.65;
                    text-align: left;
                  "
                >
                  Use the code below to verify your identity. It expires
                  shortly.
                </p>
              </td>
            </tr>

            <tr>
              <td class="content-cell" style="padding: 26px 40px 38px">
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  width="100%"
                  style="
                    width: 100%;
                    background-color: #eef2ff;
                    border: 1px solid #c7d2fe;
                    border-top: 4px solid #4f46e5;
                    border-radius: 8px;
                  "
                  bgcolor="#eef2ff"
                >
                  <tr>
                    <td align="center" style="padding: 24px 18px 23px">
                      <p
                        class="token-value"
                        style="
                          margin: 0;
                          color: #312e81;
                          font-family: 'Courier New', Courier, monospace;
                          font-size: 32px;
                          font-weight: bold;
                          letter-spacing: 7px;
                          line-height: 1.25;
                          text-align: center;
                          white-space: nowrap;
                        "
                      >
                        {{ .Token }}
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td
                class="content-cell"
                style="
                  padding: 20px 40px;
                  background-color: #f9fafb;
                  border-top: 1px solid #e5e7eb;
                "
                bgcolor="#f9fafb"
              >
                <p
                  style="
                    margin: 0;
                    color: #374151;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 13px;
                    font-weight: bold;
                    line-height: 1.5;
                  "
                >
                  Didn&rsquo;t request this code?
                </p>
                <p
                  style="
                    margin: 4px 0 0;
                    color: #6b7280;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 13px;
                    line-height: 1.6;
                  "
                >
                  You can safely ignore this email. Never share this code with
                  anyone.
                </p>
              </td>
            </tr>

          </table>
          <!--[if mso]>
                </td>
              </tr>
            </table>
          <![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
